name: tipsygo
services:
  app:
    image: tipsygo:local
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://tipsygo.pro}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      ORDER_DB_PATH: /app/data/orders.sqlite
    env_file:
      - path: /opt/tipsygo/shared/runtime.env
        required: false
    volumes:
      - orders:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  orders:
    name: tipsygo_orders
